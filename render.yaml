# Render Blueprint. Free plan: the disk is temporary and the service sleeps when idle.
# Nothing about visitors is stored. The private cache (.private/) refills itself after a restart.
# Set the two secrets in the Render dashboard; never commit them.
services:
  - type: web
    name: swap-desk-podcasts
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: QLOO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: WARM_PRESETS
        value: "1"
      - key: QLOO_CALL_CAP
        value: "1500"
      - key: OPENAI_USD_CAP
        value: "3"
